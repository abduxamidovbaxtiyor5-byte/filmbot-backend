<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0f0f0f">

    <title>Кинотеатр</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- KinoBox -->
    <script
        id="kinoboxScript"
        src="https://iiii.tatnet.app/kinobox.js"
    ></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #0f0f0f;
            color: #ffffff;

            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background: #0f0f0f;
        }

        /* =====================================================
           PLAYER
        ===================================================== */

        .player-section {
            width: 100%;
            height: 45vh;
            min-height: 250px;

            background: #000;

            position: relative;

            flex-shrink: 0;

            overflow: hidden;
        }

        .kinobox_player {
            width: 100%;
            height: 100%;

            background: #000;

            position: relative;
        }

        .kinobox_player iframe {
            width: 100% !important;
            height: 100% !important;

            border: 0 !important;

            display: block;

            background: #000;
        }

        /* =====================================================
           PLAYER LOADING
        ===================================================== */

        .player-loading {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            color: #aaa;

            font-size: 14px;

            z-index: 20;

            transition: opacity 0.3s ease;

            pointer-events: none;
        }

        .player-loading.hidden {
            opacity: 0;
        }

        .player-loading.error {
            background: rgba(0, 0, 0, 0.92);

            color: #ef4444;

            pointer-events: none;
        }

        .loading-content {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;

            max-width: 90%;
        }

        .spinner {
            width: 28px;
            height: 28px;

            border: 3px solid #333;
            border-top-color: #2481cc;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin-bottom: 12px;
        }

        .loading-text {
            color: #aaa;

            font-size: 13px;

            line-height: 1.4;
        }

        .loading-error {
            color: #ef4444;

            font-size: 13px;

            line-height: 1.5;

            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           ROOM HEADER
        ===================================================== */

        .room-header {
            height: 52px;

            padding: 6px 10px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 8px;

            background: #181818;

            border-bottom: 1px solid #292929;

            flex-shrink: 0;
        }

        .room-info {
            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 2px;
            flex: 1;
        }

        .room-title {
            font-size: 13px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .room-status-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-status {
            font-size: 10px;

            color: #4ade80;
        }

        .room-status.offline {
            color: #ef4444;
        }

        .room-status.connecting {
            color: #facc15;
        }

        .room-users-count {
            font-size: 10px;
            color: #9ca3af;
            background: #252525;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .invite-btn {
            background: #2481cc;

            color: white;

            border: 0;

            border-radius: 7px;

            padding: 7px 10px;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;

            flex-shrink: 0;
        }

        .invite-btn:active {
            transform: scale(0.97);
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-section {
            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;

            background: #181818;
        }

        .chat-messages {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 10px;

            display: flex;

            flex-direction: column;

            gap: 6px;

            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 90%;

            background: #252525;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.35;

            word-break: break-word;

            align-self: flex-start;
        }

        .msg.mine {
            align-self: flex-end;

            background: #1d4f73;
        }

        .msg.system {
            max-width: 100%;

            width: 100%;

            background: rgba(36, 129, 204, 0.13);

            color: #60a5fa;

            text-align: center;

            font-size: 11px;
        }

        .msg-user {
            font-weight: 700;

            color: #60a5fa;

            margin-right: 4px;
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .chat-input-box {
            display: flex;

            gap: 6px;

            padding: 8px 10px;

            background: #151515;

            border-top: 1px solid #292929;

            flex-shrink: 0;

            padding-bottom:
                max(8px, env(safe-area-inset-bottom));
        }

        .message-input {
            flex: 1;

            min-width: 0;

            height: 38px;

            background: #222;

            color: #fff;

            border: 1px solid #3b3b3b;

            border-radius: 8px;

            outline: none;

            padding: 0 11px;

            font-size: 13px;
        }

        .message-input:focus {
            border-color: #2481cc;
        }

        .send-btn {
            width: 64px;

            height: 38px;

            border: 0;

            border-radius: 8px;

            background: #2481cc;

            color: white;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        .send-btn:disabled {
            opacity: 0.5;

            cursor: default;
        }

        /* =====================================================
           SEARCH OVERLAY
        ===================================================== */

        .search-overlay {
            position: fixed;

            inset: 0;

            z-index: 100;

            background: rgba(0, 0, 0, 0.88);

            display: none;

            flex-direction: column;
        }

        .search-overlay.active {
            display: flex;
        }

        .search-header {
            padding: 12px;

            display: flex;

            gap: 8px;

            background: #151515;

            border-bottom: 1px solid #2a2a2a;
        }

        .search-input {
            flex: 1;

            height: 42px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #222;

            color: #fff;

            outline: none;

            padding: 0 12px;

            font-size: 14px;
        }

        .search-close {
            width: 42px;

            border: 0;

            border-radius: 8px;

            background: #333;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .search-results {
            flex: 1;

            overflow-y: auto;

            padding: 10px;
        }

        .movie-card {
            display: flex;

            gap: 10px;

            padding: 9px;

            margin-bottom: 7px;

            background: #202020;

            border-radius: 9px;

            cursor: pointer;
        }

        .movie-card:active {
            background: #2c2c2c;
        }

        .movie-poster {
            width: 55px;

            height: 78px;

            object-fit: cover;

            border-radius: 6px;

            background: #333;

            flex-shrink: 0;
        }

        .movie-info {
            min-width: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            gap: 5px;
        }

        .movie-title {
            font-size: 13px;

            font-weight: 700;

            line-height: 1.25;
        }

        .movie-year {
            font-size: 11px;

            color: #999;
        }

        .search-empty {
            text-align: center;

            color: #888;

            padding: 30px 10px;

            font-size: 13px;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;

            left: 50%;

            bottom: 75px;

            transform:
                translateX(-50%)
                translateY(20px);

            background: rgba(20, 20, 20, 0.95);

            color: white;

            padding: 9px 14px;

            border-radius: 8px;

            font-size: 12px;

            opacity: 0;

            pointer-events: none;

            transition: all 0.25s ease;

            z-index: 300;

            max-width: 90%;

            text-align: center;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .player-section {
                height: 38vh;

                min-height: 210px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         PLAYER
    ====================================================== -->

    <div class="player-section">

        <div
            class="kinobox_player"
            id="kinoboxPlayer"
        ></div>

        <div
            class="player-loading"
            id="playerLoading"
        >

            <div class="loading-content">

                <div
                    class="spinner"
                    id="playerSpinner"
                ></div>

                <div
                    class="loading-text"
                    id="playerLoadingText"
                >
                    Загрузка плеера...
                </div>

                <div
                    class="loading-error"
                    id="playerLoadingError"
                >
                    Не удалось загрузить плеер.
                    Попробуйте обновить приложение
                    или выбрать другой источник.
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ROOM HEADER
    ====================================================== -->

    <div class="room-header">

        <div class="room-info">

            <div
                class="room-title"
                id="roomTitle"
            >
                🎬 Кинотеатр
            </div>

            <div class="room-status-row">
                <div
                    class="room-status"
                    id="roomStatus"
                >
                    Одиночный просмотр
                </div>
                <div
                    class="room-users-count"
                    id="roomUsersCount"
                    style="display:none;"
                >
                    👥 1 в комнате
                </div>
            </div>

        </div>


        <button
            class="invite-btn"
            id="inviteBtn"
            onclick="inviteFriend()"
            style="display:none;"
        >
            👥 Пригласить
        </button>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div class="chat-section">

        <div
            class="chat-messages"
            id="chatMessages"
        >

            <div class="msg system">
                🎬 Плеер инициализируется. Приятного просмотра!
            </div>

        </div>


        <div class="chat-input-box">

            <input
                type="text"
                class="message-input"
                id="messageInput"
                placeholder="Написать сообщение..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendBtn"
                onclick="sendMessage()"
            >
                Отпр.
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     SEARCH OVERLAY
========================================================== -->

<div
    class="search-overlay"
    id="searchOverlay"
>

    <div class="search-header">

        <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Название фильма или сериала..."
            autocomplete="off"
        >

        <button
            class="search-close"
            onclick="closeSearch()"
        >
            ✕
        </button>

    </div>


    <div
        class="search-results"
        id="searchResults"
    >

        <div class="search-empty">
            Введи название фильма
        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================== -->

<div
    class="toast"
    id="toast"
></div>


<script>
"use strict";


/* ============================================================
   CONFIGURATION
============================================================ */

const API_BASE =
    "https://filmbot-backend.up.railway.app";

const BOT_USERNAME =
    "kinopoiskov1k_bot";

const KINOBOX_EMBED_BASE =
    "https://kinobox.tv/embed/#";


/* ============================================================
   TELEGRAM
============================================================ */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor("#0f0f0f");

        tg.setBackgroundColor("#0f0f0f");

    } catch (error) {

        console.log(
            "Telegram theme API:",
            error
        );
    }
}


/* ============================================================
   URL PARAMETERS
============================================================ */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const kpId =
    urlParams.get("kp_id");


const mode =
    urlParams.get("mode") || (urlParams.get("room") ? "friends" : "solo");


const roomId =
    urlParams.get("room");


/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let userName = "Зритель";

let socket = null;

let socketReconnectTimer = null;

let reconnectAttempts = 0;

let isClosingSocket = false;

let currentMovieId =
    kpId
        ? String(kpId)
        : null;

let currentRoomId =
    roomId
        ? String(roomId)
        : null;

let playerReady = false;

let playerInitializing = false;

let playerFallbackUsed = false;

let playerIframe = null;

let remotePlayerAction = false;

let playerLoadTimeout = null;

let lastPlayerEventTime = 0;

let isRoomController = false; // Флаг прав хоста


/* ============================================================
   DOM
============================================================ */

const chatMessages =
    document.getElementById(
        "chatMessages"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const roomStatus =
    document.getElementById(
        "roomStatus"
    );

const roomUsersCount =
    document.getElementById(
        "roomUsersCount"
    );


const roomTitle =
    document.getElementById(
        "roomTitle"
    );


const inviteBtn =
    document.getElementById(
        "inviteBtn"
    );


const playerContainer =
    document.getElementById(
        "kinoboxPlayer"
    );


const playerLoading =
    document.getElementById(
        "playerLoading"
    );


const playerSpinner =
    document.getElementById(
        "playerSpinner"
    );


const playerLoadingText =
    document.getElementById(
        "playerLoadingText"
    );


const playerLoadingError =
    document.getElementById(
        "playerLoadingError"
    );


const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


/* ============================================================
   HELPERS
============================================================ */

function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    setTimeout(
        function() {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );
}


function addSystemMessage(text) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg system";

    div.textContent =
        text;

    chatMessages.appendChild(
        div
    );

    scrollChat();
}


function addChatMessage(
    username,
    text,
    isMine = false
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg" +
        (
            isMine
                ? " mine"
                : ""
        );


    const userSpan =
        document.createElement(
            "span"
        );

    userSpan.className =
        "msg-user";

    userSpan.textContent =
        username + ":";


    const textSpan =
        document.createElement(
            "span"
        );

    textSpan.textContent =
        " " + text;


    div.appendChild(
        userSpan
    );

    div.appendChild(
        textSpan
    );


    chatMessages.appendChild(
        div
    );

    scrollChat();
}


function scrollChat() {

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


function getUserId() {

    if (
        currentUser &&
        currentUser.id
    ) {

        return String(
            currentUser.id
        );
    }

    return (
        "guest_" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );
}


/* ============================================================
   PLAYER LOADING UI
============================================================ */

function showPlayerLoading(
    text = "Загрузка плеера..."
) {

    playerLoading.classList.remove(
        "hidden"
    );

    playerLoading.classList.remove(
        "error"
    );

    playerSpinner.style.display =
        "block";

    playerLoadingText.style.display =
        "block";

    playerLoadingError.style.display =
        "none";

    playerLoadingText.textContent =
        text;
}


function hidePlayerLoading() {

    playerLoading.classList.add(
        "hidden"
    );

    playerLoading.classList.remove(
        "error"
    );
}


function showPlayerError(
    message
) {

    playerLoading.classList.remove(
        "hidden"
    );

    playerLoading.classList.add(
        "error"
    );

    playerSpinner.style.display =
        "none";

    playerLoadingText.style.display =
        "block";

    playerLoadingError.style.display =
        "block";

    playerLoadingText.textContent =
        message ||
        "Ошибка загрузки плеера.";

}


/* ============================================================
   TELEGRAM USER
============================================================ */

function loadTelegramUser() {

    if (
        !tg
    ) {

        currentUser = null;

        userName =
            "Зритель";

        return;
    }


    const unsafeUser =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user
            : null;


    if (
        unsafeUser
    ) {

        currentUser =
            unsafeUser;

        userName =
            unsafeUser.first_name ||
            unsafeUser.username ||
            "Зритель";

        return;
    }


    currentUser = null;

    userName =
        "Зритель";
}


async function authenticateTelegram() {

    loadTelegramUser();

    return true;
}


/* ============================================================
   FIND KINOBOX FUNCTION
============================================================ */

function getKinoboxFunction() {

    if (
        typeof window.kinobox ===
        "function"
    ) {

        return window.kinobox;
    }

    return null;
}


/* ============================================================
   FIND PLAYER IFRAME
============================================================ */

function findPlayerIframe() {

    const iframe =
        playerContainer.querySelector(
            "iframe"
        );

    if (
        iframe
    ) {

        playerIframe =
            iframe;

        return iframe;
    }

    return null;
}


/* ============================================================
   PLAYER IFRAME LOAD
============================================================ */

function waitForPlayerIframe(
    timeout = 15000
) {

    return new Promise(
        function(resolve) {

            const started =
                Date.now();


            function check() {

                const iframe =
                    findPlayerIframe();


                if (
                    iframe
                ) {

                    resolve(
                        iframe
                    );

                    return;
                }


                if (
                    Date.now() -
                    started >=
                    timeout
                ) {

                    resolve(
                        null
                    );

                    return;
                }


                setTimeout(
                    check,
                    200
                );
            }


            check();
        }
    );
}


/* ============================================================
   FALLBACK DIRECT IFRAME
============================================================ */

function initializeDirectIframe(
    movieId
) {

    if (
        !movieId
    ) {

        showPlayerError(
            "Фильм не выбран."
        );

        return;
    }


    playerFallbackUsed =
        true;

    playerReady =
        false;


    showPlayerLoading(
        "Загрузка KinoBox..."
    );


    playerContainer.innerHTML =
        "";


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        KINOBOX_EMBED_BASE +
        encodeURIComponent(
            String(movieId)
        );


    iframe.width =
        "100%";

    iframe.height =
        "100%";

    iframe.frameBorder =
        "0";

    iframe.allowFullscreen =
        true;

    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen"
    );


    iframe.style.width =
        "100%";

    iframe.style.height =
        "100%";

    iframe.style.border =
        "0";

    iframe.style.display =
        "block";


    iframe.addEventListener(
        "load",
        function() {

            playerIframe =
                iframe;

            playerReady =
                true;

            clearTimeout(
                playerLoadTimeout
            );

            hidePlayerLoading();

        }
    );


    iframe.addEventListener(
        "error",
        function() {

            playerReady =
                false;

            showPlayerError(
                "KinoBox не удалось загрузить."
            );

        }
    );


    playerContainer.appendChild(
        iframe
    );


    playerLoadTimeout =
        setTimeout(
            function() {

                if (
                    !playerReady
                ) {

                    showPlayerError(
                        "Плеер слишком долго загружается."
                    );
                }

            },
            20000
        );
}


/* ============================================================
   KINOBOX.JS PLAYER
============================================================ */

async function initializeKinoboxJs(
    movieId
) {

    const kinobox =
        getKinoboxFunction();


    if (
        !kinobox
    ) {

        return false;
    }


    playerReady =
        false;

    playerFallbackUsed =
        false;


    showPlayerLoading(
        "Инициализация KinoBox..."
    );


    playerContainer.innerHTML =
        "";


    try {

        kinobox(
            "#kinoboxPlayer",
            {
                search: {
                    kinopoisk:
                        Number(movieId)
                }
            }
        );

    } catch (error) {

        return false;
    }


    const iframe =
        await waitForPlayerIframe(
            15000
        );


    if (
        !iframe
    ) {

        return false;
    }


    playerIframe =
        iframe;


    iframe.addEventListener(
        "load",
        function() {

            playerReady =
                true;

            hidePlayerLoading();

        },
        {
            once: true
        }
    );


    if (
        iframe.contentWindow
    ) {

        setTimeout(
            function() {

                if (
                    !playerReady
                ) {

                    playerReady =
                        true;

                    hidePlayerLoading();

                }

            },
            3000
        );
    }


    return true;
}


/* ============================================================
   MAIN PLAYER INITIALIZATION
============================================================ */

async function initializePlayer(
    movieId
) {

    if (
        playerInitializing
    ) {

        return;
    }


    if (
        !movieId
    ) {

        showPlayerError(
            "Фильм не выбран."
        );

        return;
    }


    playerInitializing =
        true;

    currentMovieId =
        String(movieId);


    clearTimeout(
        playerLoadTimeout
    );


    playerReady =
        false;

    playerIframe =
        null;

    playerFallbackUsed =
        false;


    showPlayerLoading(
        "Загрузка плеера..."
    );


    try {

        const jsStarted =
            await initializeKinoboxJs(
                currentMovieId
            );


        if (
            jsStarted
        ) {

            return;
        }


        initializeDirectIframe(
            currentMovieId
        );

    } catch (error) {

        try {

            initializeDirectIframe(
                currentMovieId
            );

        } catch (fallbackError) {

            showPlayerError(
                "Не удалось запустить плеер."
            );
        }

    } finally {

        playerInitializing =
            false;
    }
}


/* ============================================================
   SEARCH
============================================================ */

function openSearch() {

    searchOverlay.classList.add(
        "active"
    );

    searchInput.focus();
}


function closeSearch() {

    searchOverlay.classList.remove(
        "active"
    );
}


let searchTimer = null;


searchInput.addEventListener(
    "input",
    function() {

        clearTimeout(
            searchTimer
        );


        const query =
            searchInput.value.trim();


        if (
            !query
        ) {

            searchResults.innerHTML =
                `
                <div class="search-empty">
                    Введи название фильма
                </div>
                `;

            return;
        }


        searchTimer =
            setTimeout(
                function() {

                    searchMovies(
                        query
                    );

                },
                400
            );
    }
);


async function searchMovies(
    query
) {

    searchResults.innerHTML =
        `
        <div class="search-empty">
            🔍 Поиск...
        </div>
        `;


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        renderSearchResults(
            data.results || []
        );

    } catch (error) {

        searchResults.innerHTML =
            `
            <div class="search-empty">
                ❌ Ошибка поиска.
            </div>
            `;
    }
}


function renderSearchResults(
    items
) {

    if (
        !items.length
    ) {

        searchResults.innerHTML =
            `
            <div class="search-empty">
                ❌ Ничего не найдено
            </div>
            `;

        return;
    }


    searchResults.innerHTML =
        "";


    items.forEach(
        function(movie) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "movie-card";


            const poster =
                document.createElement(
                    "img"
                );

            poster.className =
                "movie-poster";

            poster.alt =
                movie.name ||
                "";


            if (
                movie.poster
            ) {

                poster.src =
                    movie.poster;

            } else {

                poster.style.display =
                    "none";
            }


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "movie-info";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "movie-title";

            title.textContent =
                movie.name ||
                "Без названия";


            const year =
                document.createElement(
                    "div"
                );

            year.className =
                "movie-year";

            year.textContent =
                movie.year ||
                "Год неизвестен";


            info.appendChild(
                title
            );

            info.appendChild(
                year
            );


            card.appendChild(
                poster
            );

            card.appendChild(
                info
            );


            card.onclick =
                function() {

                    selectMovie(
                        movie.id,
                        movie.name
                    );

                };


            searchResults.appendChild(
                card
            );

        }
    );
}


function selectMovie(
    movieId,
    title
) {

    if (
        !movieId
    ) {

        return;
    }


    currentMovieId =
        String(movieId);


    closeSearch();


    roomTitle.textContent =
        "🎬 " +
        (
            title ||
            "Кинотеатр"
        );


    initializePlayer(
        currentMovieId
    );
}


/* ============================================================
   ROOM STATUS & PARTICIPANTS
============================================================ */

function setRoomStatus(
    text,
    state
) {

    roomStatus.textContent =
        text;


    roomStatus.className =
        "room-status";


    if (
        state
    ) {

        roomStatus.classList.add(
            state
        );
    }
}


function updateRoomUsers(usersList) {
    if (!usersList || !usersList.length) {
        roomUsersCount.style.display = "none";
        return;
    }

    roomUsersCount.style.display = "inline-block";
    roomUsersCount.textContent = `👥 ${usersList.length} в комнате`;
    
    const names = usersList.map(u => u.name).join(", ");
    roomUsersCount.title = `В комнате: ${names}`;
}


/* ============================================================
   WEBSOCKET URL & CONNECTION
============================================================ */

function getWebSocketUrl(
    room
) {

    const apiUrl =
        new URL(
            API_BASE
        );


    const protocol =
        apiUrl.protocol ===
            "https:"
            ? "wss:"
            : "ws:";


    return (
        protocol +
        "//" +
        apiUrl.host +
        "/ws/room/" +
        encodeURIComponent(
            room
        )
    );
}


function connectRoom() {

    if (!currentRoomId) {
        return;
    }


    if (
        socket &&
        (
            socket.readyState ===
                WebSocket.OPEN ||
            socket.readyState ===
                WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setRoomStatus(
        "🟡 Подключение...",
        "connecting"
    );


    const wsUrl =
        getWebSocketUrl(
            currentRoomId
        );


    try {

        socket =
            new WebSocket(
                wsUrl
            );

    } catch (error) {

        setRoomStatus(
            "🔴 Ошибка соединения",
            "offline"
        );

        scheduleReconnect();

        return;
    }


    socket.onopen =
        function() {

            reconnectAttempts =
                0;


            setRoomStatus(
                "🟢 Комната подключена",
                ""
            );


            sendBtn.disabled =
                false;


            const joinMessage = {
                type: "join",

                kp_id:
                    currentMovieId,

                initData:
                    tg
                        ? tg.initData
                        : "",

                user_id:
                    currentUser
                        ? currentUser.id
                        : null,

                name:
                    userName
            };


            socket.send(
                JSON.stringify(
                    joinMessage
                )
            );
        };


    socket.onmessage =
        function(event) {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                handleRoomMessage(
                    data
                );

            } catch (error) {
            }
        };


    socket.onerror =
        function(error) {

            setRoomStatus(
                "🔴 Ошибка соединения",
                "offline"
            );
        };


    socket.onclose =
        function(event) {

            socket =
                null;


            sendBtn.disabled =
                true;


            if (
                isClosingSocket
            ) {

                return;
            }


            setRoomStatus(
                "🔴 Соединение потеряно",
                "offline"
            );


            scheduleReconnect();
        };
}


function scheduleReconnect() {

    if (
        socketReconnectTimer
    ) {

        return;
    }


    if (!currentRoomId) {
        return;
    }


    reconnectAttempts++;


    const delay =
        Math.min(
            1000 *
                Math.pow(
                    2,
                    reconnectAttempts
                ),
            15000
        );


    socketReconnectTimer =
        setTimeout(
            function() {

                socketReconnectTimer =
                    null;


                connectRoom();

            },
            delay
        );
}


/* ============================================================
   ROOM MESSAGES & SYNC POSITION FOR LATECOMERS
============================================================ */

function handleRoomMessage(
    data
) {

    switch (
        data.type
    ) {

        case "room_state":

            if (
                data.room
            ) {
                if (
                    data.room.kp_id &&
                    !currentMovieId
                ) {

                    currentMovieId =
                        String(
                            data.room.kp_id
                        );


                    initializePlayer(
                        currentMovieId
                    );
                }

                const myId = getUserId();
                isRoomController = (data.room.controller_id === myId);

                if (isRoomController) {
                    roomTitle.textContent = "🍿 Совместный просмотр (Вы управляете)";
                } else {
                    roomTitle.textContent = "🍿 Совместный просмотр";
                }

                if (data.room.users) {
                    updateRoomUsers(data.room.users);
                }

                // СИНХРОНИЗАЦИЯ ДЛЯ ОПОЗДАВШИХ: если плеер уже готов, перематываем на текущую позицию комнаты
                if (typeof data.room.position === "number" && data.room.position > 2) {
                    handleRemotePlayer({ type: "seek", position: data.room.position });
                }
            }

            break;


        case "chat":

            if (
                data.message
            ) {

                addChatMessage(
                    data.message.name ||
                        "Зритель",

                    data.message.message ||
                        "",

                    data.message.user_id ===
                        getUserId()
                );
            }

            break;


        case "play":

        case "pause":

        case "seek":

            handleRemotePlayer(
                data
            );

            break;


        case "pong":

            break;


        case "error":

            addSystemMessage(
                "❌ " +
                (
                    data.message ||
                    "Ошибка комнаты"
                )
            );

            break;
    }
}


/* ============================================================
   CHAT
============================================================ */

function sendMessage() {

    const text =
        messageInput.value.trim();


    if (
        !text
    ) {

        return;
    }


    if (
        !currentRoomId
    ) {

        addChatMessage(
            userName,
            text,
            true
        );


        messageInput.value =
            "";


        return;
    }


    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        showToast(
            "Нет соединения с комнатой"
        );

        return;
    }


    socket.send(
        JSON.stringify(
            {
                type:
                    "chat",

                message:
                    text
            }
        )
    );


    messageInput.value =
        "";
}


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* ============================================================
   PLAYER EVENTS (Только для создателя комнаты)
============================================================ */

window.addEventListener(
    "message",
    function(event) {

        if (!event.data || !isRoomController) {
            return; // Обычные зрители не шлют команды плеера на сервер
        }


        const iframe =
            playerIframe ||
            findPlayerIframe();


        if (
            iframe &&
            event.source !==
                iframe.contentWindow
        ) {

            return;
        }


        let type =
            event.data.type ||
            event.data.event ||
            event.data.action;


        let time =
            event.data.time ??
            event.data.currentTime ??
            event.data.position;


        if (
            typeof type !==
            "string"
        ) {

            return;
        }


        type =
            type.toLowerCase();


        const now =
            Date.now();


        if (
            now -
            lastPlayerEventTime <
            100
        ) {

            return;
        }


        lastPlayerEventTime =
            now;


        if (
            type === "play" ||
            type === "playing"
        ) {

            sendPlayerState(
                "play",
                time
            );

        } else if (
            type === "pause" ||
            type === "paused"
        ) {

            sendPlayerState(
                "pause",
                time
            );

        } else if (
            type === "seek" ||
            type === "userseek"
        ) {

            sendPlayerState(
                "seek",
                time
            );
        }

    }
);


function sendPlayerState(
    action,
    time
) {

    if (
        remotePlayerAction
    ) {

        return;
    }


    if (!currentRoomId) {
        return;
    }


    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return;
    }


    const numericTime =
        Number(
            time
        );


    socket.send(
        JSON.stringify(
            {
                type:
                    action,

                position:
                    Number.isFinite(
                        numericTime
                    )
                        ? numericTime
                        : 0
            }
        )
    );
}


function handleRemotePlayer(
    data
) {

    const iframe =
        playerIframe ||
        findPlayerIframe();


    if (
        !iframe
    ) {

        return;
    }


    const action =
        data.type;


    const time =
        Number(
            data.position || 0
        );


    remotePlayerAction =
        true;


    try {

        iframe.contentWindow.postMessage(
            {
                type:
                    action,

                action:
                    action,

                time:
                    time,

                currentTime:
                    time,

                position:
                    time
            },
            "*"
        );

    } catch (error) {

    } finally {

        setTimeout(
            function() {

                remotePlayerAction =
                    false;

            },
            500
        );
    }
}


/* ============================================================
   INVITE FRIEND
============================================================ */

function inviteFriend() {

    if (
        !currentRoomId
    ) {

        showToast(
            "Комната ещё не создана"
        );

        return;
    }


    (function() {
        const startParam =
            "room_" +
            currentRoomId +
            "_" +
            currentMovieId;


        const botUrl =
            "https://t.me/" +
            BOT_USERNAME +
            "?start=" +
            encodeURIComponent(
                startParam
            );


        const shareUrl =
            "https://t.me/share/url?url=" +
            encodeURIComponent(
                botUrl
            ) +
            "&text=" +
            encodeURIComponent(
                "🍿 Заходи! Будем смотреть фильм вместе!"
            );


        try {

            if (
                tg &&
                typeof tg.openTelegramLink ===
                    "function"
            ) {

                tg.openTelegramLink(
                    shareUrl
                );

            } else {

                window.open(
                    shareUrl,
                    "_blank"
                );
            }

        } catch (error) {

            window.open(
                shareUrl,
                "_blank"
            );
        }
    })();
}


/* ============================================================
   INITIALIZATION
============================================================ */

async function initApp() {

    await authenticateTelegram();


    if (
        currentRoomId
    ) {

        roomTitle.textContent =
            "🍿 Совместный просмотр";


        setRoomStatus(
            "🟡 Подключение...",
            "connecting"
        );


        inviteBtn.style.display =
            "block";

    } else {

        roomTitle.textContent =
            "🎬 Одиночный просмотр";


        setRoomStatus(
            "Одиночный просмотр",
            ""
        );
    }


    if (
        currentMovieId
    ) {

        await initializePlayer(
            currentMovieId
        );

    } else {

        showPlayerError(
            "Фильм не выбран."
        );
    }


    if (
        currentRoomId
    ) {

        connectRoom();
    }
}


window.addEventListener(
    "beforeunload",
    function() {

        isClosingSocket =
            true;


        if (
            socket
        ) {

            try {

                socket.close();

            } catch (error) {
            }
        }


        clearTimeout(
            socketReconnectTimer
        );


        clearTimeout(
            playerLoadTimeout
        );
    }
);


initApp();

</script>
